name: Deploy intranet to GitHub Pages

# GitHub Pages is published from the intranet directory.
on:
  push:
    branches: [main]
    paths:
      - 'intranet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload intranet
        uses: actions/upload-pages-artifact@v4
        with:
          path: intranet
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
