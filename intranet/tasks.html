<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月次ルーティン | 焼肉ここから</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .step-done .step-icon    { background: #10b981 !important; }
    .step-done .step-label   { text-decoration: line-through; color: #6b7280; }
    .step-done .step-check   { border-color: #10b981; background: #10b981; }
    .step-done .step-check i { display: block; }
    .step-check i            { display: none; }
    .connector-done          { background: #10b981 !important; }
    .flow-step               { transition: all 0.2s; }
    .flow-step:hover         { transform: translateY(-1px); }
  </style>
</head>
<body class="bg-gray-950 min-h-screen text-white">

<!-- ===== PW画面 ===== -->
<div id="pw-screen" class="fixed inset-0 z-50 bg-gray-950 flex flex-col items-center justify-center gap-6" style="transition:opacity .3s">
  <img src="img/logo.png" alt="logo" class="h-12 mb-2">
  <h1 class="text-xl font-black text-yellow-400">月次ルーティン管理</h1>
  <p class="text-gray-500 text-sm">経営者専用ページです。パスワードを入力してください。</p>
  <div class="flex gap-2">
    <input id="pw-input" type="password" placeholder="パスワード"
      class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white text-sm focus:outline-none focus:border-yellow-400 w-56"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()" class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold px-5 py-2 rounded-lg text-sm transition">入室</button>
  </div>
  <p id="pw-error" class="text-red-400 text-sm hidden">パスワードが違います</p>
</div>

<!-- ===== メイン ===== -->
<div id="main-content" class="hidden">

  <!-- ヘッダー -->
  <header class="flex justify-between items-center px-6 md:px-10 py-4 border-b border-gray-800">
    <div class="flex items-center gap-3">
      <img src="img/logo.png" alt="logo" class="h-9">
      <div>
        <div class="font-black text-base text-yellow-400">月次ルーティン</div>
        <div class="text-xs text-gray-500">Management Only</div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <a href="management.html" class="text-gray-500 hover:text-white text-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-arrow-left"></i> 経営ダッシュボード
      </a>
      <button onclick="logout()" class="border border-gray-700 hover:border-red-500/50 px-3 py-1.5 rounded-lg text-xs text-gray-400 hover:text-red-400 flex items-center gap-2 transition">
        <i class="fa-solid fa-right-from-bracket"></i> ログアウト
      </button>
    </div>
  </header>

  <main class="px-4 md:px-6 py-4 max-w-6xl mx-auto space-y-4">

    <!-- 月セレクター + 進捗バー -->
    <div class="bg-gray-900 rounded-xl border border-gray-800 px-4 py-3 flex items-center gap-4">
      <button onclick="changeMonth(-1)" class="text-gray-500 hover:text-white transition px-1"><i class="fa-solid fa-chevron-left text-xs"></i></button>
      <span id="month-label" class="text-sm font-black text-white w-20 text-center"></span>
      <button onclick="changeMonth(1)" class="text-gray-500 hover:text-white transition px-1"><i class="fa-solid fa-chevron-right text-xs"></i></button>
      <div class="flex-1 flex items-center gap-3">
        <div class="flex-1 bg-gray-800 rounded-full h-2 overflow-hidden">
          <div id="progress-bar" class="h-2 rounded-full bg-gradient-to-r from-yellow-500 to-emerald-400 transition-all duration-500" style="width:0%"></div>
        </div>
        <span id="progress-label" class="text-xs font-black text-yellow-400 whitespace-nowrap">0 / 6</span>
      </div>
    </div>

    <!-- 2カラムレイアウト -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

      <!-- ===== 月次ルーティン ===== -->
      <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
        <div class="px-4 py-2.5 border-b border-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-rotate text-yellow-400 text-xs"></i>
          <span class="font-black text-sm text-gray-200">月次ルーティン</span>
          <span class="text-[10px] text-gray-500 ml-auto">クリックでチェック</span>
        </div>
        <div class="divide-y divide-gray-800/60">

          <!-- s3 -->
          <div class="flow-step flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-gray-800/40 transition" onclick="toggleStep('s3')" id="step-s3">
            <div class="step-check w-5 h-5 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 transition-all">
              <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <span class="step-label text-sm flex-1">仕入債務確定 → CSV → MF会計入力</span>
            <p class="step-timestamp text-[10px] text-gray-500 hidden"></p>
          </div>

          <!-- s4 -->
          <div class="flow-step flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-gray-800/40 transition" onclick="toggleStep('s4')" id="step-s4">
            <div class="step-check w-5 h-5 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 transition-all">
              <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <span class="step-label text-sm flex-1">MF勤怠 → MF給与 → MF会計</span>
            <p class="step-timestamp text-[10px] text-gray-500 hidden"></p>
          </div>

          <!-- s5 -->
          <div class="flow-step flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-gray-800/40 transition" onclick="toggleStep('s5')" id="step-s5">
            <div class="step-check w-5 h-5 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 transition-all">
              <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <span class="step-label text-sm flex-1">給与振込手続き完了</span>
            <p class="step-timestamp text-[10px] text-gray-500 hidden"></p>
          </div>

          <!-- s6 -->
          <div class="flow-step flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-gray-800/40 transition" onclick="toggleStep('s6')" id="step-s6">
            <div class="step-check w-5 h-5 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 transition-all">
              <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <span class="step-label text-sm flex-1">買掛・未払の支払手続き完了</span>
            <p class="step-timestamp text-[10px] text-gray-500 hidden"></p>
          </div>

        </div>
      </div>

      <!-- ===== 日次ログ ===== -->
      <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
        <div class="px-4 py-2.5 border-b border-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-calendar-check text-cyan-400 text-xs"></i>
          <span class="font-black text-sm text-gray-200">日次ログ</span>
          <span class="text-[10px] text-gray-500 ml-auto">本日完了したらチェック</span>
        </div>

        <!-- ① スマレジ→MF会計 -->
        <div class="border-b border-gray-800/60">
          <div class="flex items-center justify-between px-4 py-2.5">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></span>
              <span class="text-xs text-gray-300 truncate">スマレジ → MF会計　売上計上</span>
            </div>
            <button onclick="logEntry('sales')" class="shrink-0 ml-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1 rounded-lg text-[11px] flex items-center gap-1 transition">
              <i class="fa-solid fa-circle-check text-[10px]"></i> 完了
            </button>
          </div>
          <div id="today-banner-sales" class="hidden px-4 pb-2 text-emerald-400 text-[11px] font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-circle-check text-[10px]"></i><span id="today-label-sales"></span>
          </div>
          <div id="log-list-sales" class="px-4 pb-2 max-h-24 overflow-y-auto space-y-0.5"></div>
        </div>

        <!-- ② 普通預金への売上入金 -->
        <div class="border-b border-gray-800/60">
          <div class="flex items-center justify-between px-4 py-2.5">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-400 shrink-0"></span>
              <span class="text-xs text-gray-300 truncate">普通預金への売上入金　確認</span>
            </div>
            <button onclick="logEntry('deposit')" class="shrink-0 ml-2 bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded-lg text-[11px] flex items-center gap-1 transition">
              <i class="fa-solid fa-circle-check text-[10px]"></i> 完了
            </button>
          </div>
          <div id="today-banner-deposit" class="hidden px-4 pb-2 text-emerald-400 text-[11px] font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-circle-check text-[10px]"></i><span id="today-label-deposit"></span>
          </div>
          <div id="log-list-deposit" class="px-4 pb-2 max-h-24 overflow-y-auto space-y-0.5"></div>
        </div>

        <!-- ③ 売上金の消込 -->
        <div>
          <div class="flex items-center justify-between px-4 py-2.5">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-1.5 h-1.5 rounded-full bg-purple-400 shrink-0"></span>
              <span class="text-xs text-gray-300 truncate">売上金の消込</span>
            </div>
            <button onclick="logEntry('reconcile')" class="shrink-0 ml-2 bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-1 rounded-lg text-[11px] flex items-center gap-1 transition">
              <i class="fa-solid fa-circle-check text-[10px]"></i> 完了
            </button>
          </div>
          <div id="today-banner-reconcile" class="hidden px-4 pb-2 text-emerald-400 text-[11px] font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-circle-check text-[10px]"></i><span id="today-label-reconcile"></span>
          </div>
          <div id="log-list-reconcile" class="px-4 pb-2 max-h-24 overflow-y-auto space-y-0.5"></div>
        </div>
      </div>

    </div>

    <!-- ===== フリータスク（カンバン） ===== -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-list-check text-yellow-400 text-xs"></i>
          <span class="font-black text-sm text-gray-200">フリータスク</span>
        </div>
        <button onclick="openAddTask()" class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition">
          <i class="fa-solid fa-plus"></i> 追加
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="bg-gray-900 rounded-xl border border-gray-800 p-3">
          <div class="flex items-center gap-2 mb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
            <span class="font-bold text-gray-300 text-xs">未着手</span>
            <span id="count-todo" class="ml-auto text-[10px] bg-gray-800 text-gray-400 rounded-full px-1.5 py-0.5">0</span>
          </div>
          <div id="col-todo" class="min-h-[60px] space-y-1.5" ondragover="dragOver(event)" ondrop="drop(event,'todo')"></div>
        </div>
        <div class="bg-gray-900 rounded-xl border border-gray-800 p-3">
          <div class="flex items-center gap-2 mb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
            <span class="font-bold text-yellow-300 text-xs">進行中</span>
            <span id="count-inprogress" class="ml-auto text-[10px] bg-gray-800 text-gray-400 rounded-full px-1.5 py-0.5">0</span>
          </div>
          <div id="col-inprogress" class="min-h-[60px] space-y-1.5" ondragover="dragOver(event)" ondrop="drop(event,'inprogress')"></div>
        </div>
        <div class="bg-gray-900 rounded-xl border border-gray-800 p-3">
          <div class="flex items-center gap-2 mb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span class="font-bold text-emerald-300 text-xs">完了</span>
            <span id="count-done" class="ml-auto text-[10px] bg-gray-800 text-gray-400 rounded-full px-1.5 py-0.5">0</span>
          </div>
          <div id="col-done" class="min-h-[60px] space-y-1.5" ondragover="dragOver(event)" ondrop="drop(event,'done')"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- タスクモーダル -->
<div id="task-modal" class="fixed inset-0 z-50 bg-black/70 hidden flex items-center justify-center p-4">
  <div class="bg-gray-900 rounded-2xl border border-gray-700 w-full max-w-md p-6 space-y-4">
    <h3 class="font-black text-lg" id="modal-title">タスク追加</h3>
    <div>
      <label class="text-xs text-gray-400 mb-1 block">タイトル <span class="text-red-400">*</span></label>
      <input id="task-title" type="text" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
    </div>
    <div>
      <label class="text-xs text-gray-400 mb-1 block">担当</label>
      <input id="task-assignee" type="text" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
    </div>
    <div>
      <label class="text-xs text-gray-400 mb-1 block">期限</label>
      <input id="task-due" type="date" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
    </div>
    <div>
      <label class="text-xs text-gray-400 mb-1 block">優先度</label>
      <select id="task-priority" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
        <option value="high">🔴 高</option>
        <option value="mid" selected>🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
    </div>
    <div>
      <label class="text-xs text-gray-400 mb-1 block">メモ</label>
      <textarea id="task-note" rows="2" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400 resize-none"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button onclick="saveTask()" class="flex-1 bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold py-2 rounded-lg text-sm transition">保存</button>
      <button onclick="closeModal()" class="flex-1 border border-gray-600 text-gray-400 py-2 rounded-lg text-sm transition">キャンセル</button>
      <button id="delete-task-btn" onclick="deleteTask()" class="hidden border border-red-800 hover:border-red-500 text-red-400 px-3 py-2 rounded-lg text-sm transition"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>
</div>

<script>
const PASSWORD    = 'daigaku5678';
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycby4N4V10YErqIAwOfrxBqr9uhie06xvHSPszug4mPdzohHPjLxXiJNDPfu_dgJKcOyG/exec';
const SESSION_KEY = 'mgmt_auth';

// ===== 認証 =====
function checkPw() {
  if (document.getElementById('pw-input').value.trim().toLowerCase() === PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, '1');
    const s = document.getElementById('pw-screen');
    s.style.opacity = '0';
    setTimeout(() => { s.classList.add('hidden'); document.getElementById('main-content').classList.remove('hidden'); init(); }, 300);
  } else {
    document.getElementById('pw-error').classList.remove('hidden');
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
function logout() { sessionStorage.removeItem(SESSION_KEY); location.reload(); }
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
if (sessionStorage.getItem(SESSION_KEY) === '1') {
  document.getElementById('pw-screen').classList.add('hidden');
  document.getElementById('main-content').classList.remove('hidden');
}

// ===== 月管理 =====
const today  = new Date();
let viewYear = today.getFullYear();
let viewMonth= today.getMonth() + 1; // 1-12

function monthKey() { return `${viewYear}-${String(viewMonth).padStart(2,'0')}`; }
function isCurrentMonth() { return viewYear === today.getFullYear() && viewMonth === today.getMonth() + 1; }

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  updateMonthUI();
  renderRoutine();
}

function updateMonthUI() {
  const label = `${viewYear}年${viewMonth}月`;
  document.getElementById('month-label').textContent   = label;
  document.getElementById('month-heading').textContent = `${label} 月次チェックリスト`;
}

// ===== GAS =====
async function gasGet() {
  try { const r = await fetch(GAS_API_URL, { cache:'no-store' }); return r.json(); } catch { return null; }
}
function gasPost(key, value) {
  fetch(GAS_API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({key, value}) }).catch(()=>{});
}

// ===== データ =====
let routineData = {};
let tasksData   = [];
const LOG_TYPES = {
  sales:      { label: '売上計上完了',       lsKey: 'log_sales' },
  deposit:    { label: '売上入金確認完了',   lsKey: 'log_deposit' },
  reconcile:  { label: '売上金消込完了',     lsKey: 'log_reconcile' },
};
let dailyLogs = { sales: [], deposit: [], reconcile: [] };

async function init() {
  updateMonthUI();
  const data = await gasGet();
  if (data && !data.error) {
    routineData          = data.routine       || {};
    tasksData            = data.tasks         || [];
    dailyLogs.sales      = data.log_sales     || [];
    dailyLogs.deposit    = data.log_deposit   || [];
    dailyLogs.reconcile  = data.log_reconcile || [];
  } else {
    routineData         = JSON.parse(localStorage.getItem('routine_data')    || '{}');
    tasksData           = JSON.parse(localStorage.getItem('mgmt_tasks')      || '[]');
    dailyLogs.sales     = JSON.parse(localStorage.getItem('log_sales')       || '[]');
    dailyLogs.deposit   = JSON.parse(localStorage.getItem('log_deposit')     || '[]');
    dailyLogs.reconcile = JSON.parse(localStorage.getItem('log_reconcile')   || '[]');
  }
  renderRoutine();
  renderKanban();
  Object.keys(LOG_TYPES).forEach(renderLog);
}

// ===== 日次ログ =====
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}`;
}

function logEntry(type) {
  const key     = todayKey();
  const timeStr = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
  const log     = dailyLogs[type];
  const cfg     = LOG_TYPES[type];

  if (log.some(e => e.dateKey === key)) {
    if (!confirm(`${key} の${cfg.label}は既に記録済みです。再登録しますか？`)) return;
    dailyLogs[type] = log.filter(e => e.dateKey !== key);
  }

  dailyLogs[type].unshift({ dateKey: key, label: `${key} ${cfg.label}`, ts: timeStr });
  localStorage.setItem(cfg.lsKey, JSON.stringify(dailyLogs[type]));
  gasPost(cfg.lsKey, dailyLogs[type]);
  renderLog(type);
}

function renderLog(type) {
  const log     = dailyLogs[type];
  const key     = todayKey();
  const today   = log.find(e => e.dateKey === key);
  const banner  = document.getElementById(`today-banner-${type}`);
  const label   = document.getElementById(`today-label-${type}`);
  const list    = document.getElementById(`log-list-${type}`);

  if (today) {
    banner.classList.remove('hidden');
    label.textContent = `${today.label}　${today.ts}記録`;
  } else {
    banner.classList.add('hidden');
  }

  list.innerHTML = log.length === 0
    ? ''
    : log.slice(0, 4).map(e => {
        const isToday = e.dateKey === key;
        return `<div class="flex items-center justify-between py-0.5">
          <span class="text-[11px] ${isToday ? 'text-emerald-400 font-bold' : 'text-gray-600'}">${e.label}</span>
          <span class="text-[10px] text-gray-700">${e.ts}</span>
        </div>`;
      }).join('');
}

// ===== ルーティン =====
const STEP_IDS = ['s3','s4','s5','s6'];

function getMonthData() {
  const k = monthKey();
  if (!routineData[k]) routineData[k] = {};
  return routineData[k];
}

function renderRoutine() {
  const md = getMonthData();
  let doneCount = 0;
  STEP_IDS.forEach(id => {
    const el   = document.getElementById(`step-${id}`);
    const ts   = el.querySelector('.step-timestamp');
    const info = md[id] || { done: false, ts: null };

    // TODO バッジの管理
    let badge = el.querySelector('.todo-badge');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'todo-badge text-[10px] font-black px-2 py-0.5 rounded border ml-2 align-middle';
      el.querySelector('.step-label').after(badge);
    }

    if (info.done) {
      el.classList.add('step-done');
      ts.classList.remove('hidden');
      ts.textContent = `✓ ${info.ts}`;
      badge.textContent  = '完了';
      badge.className    = 'todo-badge text-[10px] font-black px-2 py-0.5 rounded border ml-2 align-middle bg-emerald-900/50 text-emerald-400 border-emerald-700';
      doneCount++;
    } else {
      el.classList.remove('step-done');
      ts.classList.add('hidden');
      badge.textContent = 'TODO';
      badge.className   = 'todo-badge text-[10px] font-black px-2 py-0.5 rounded border ml-2 align-middle bg-yellow-900/40 text-yellow-400 border-yellow-700';
    }

    // コネクター
    const conn = document.querySelector(`.connector-${id}`);
    if (conn) conn.classList.toggle('connector-done', info.done);
  });
  // 進捗
  const pct = Math.round(doneCount / STEP_IDS.length * 100);
  document.getElementById('progress-bar').style.width   = pct + '%';
  document.getElementById('progress-label').textContent = `${doneCount} / ${STEP_IDS.length} 完了`;
}

function toggleStep(id) {
  const md   = getMonthData();
  const cur  = md[id] || { done: false, ts: null };
  const now  = new Date().toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
  md[id]     = cur.done ? { done: false, ts: null } : { done: true, ts: now };
  saveRoutine();
  renderRoutine();
}

function saveRoutine() {
  localStorage.setItem('routine_data', JSON.stringify(routineData));
  gasPost('routine', routineData);
}

// ===== カンバン =====
let editingTaskId = null, draggedTaskId = null;
const PRIORITY_ICON = { high:'🔴', mid:'🟡', low:'🟢' };

function renderKanban() {
  ['todo','inprogress','done'].forEach(status => {
    const col   = document.getElementById(`col-${status}`);
    const count = document.getElementById(`count-${status}`);
    const tasks = tasksData.filter(t => t.status === status);
    count.textContent = tasks.length;
    col.innerHTML = tasks.length === 0
      ? '<div class="text-gray-700 text-xs text-center py-4">なし</div>'
      : tasks.map(t => `
        <div class="bg-gray-800 rounded-lg p-3 border border-gray-700 hover:border-gray-600 transition cursor-grab"
          draggable="true" ondragstart="dragStart('${t.id}')" ondragend="dragEnd()" onclick="openEditTask('${t.id}')">
          <div class="flex items-start justify-between gap-2 mb-1">
            <span class="font-bold text-sm leading-snug">${t.title}</span>
            <span class="shrink-0">${PRIORITY_ICON[t.priority]||'🟡'}</span>
          </div>
          ${t.assignee ? `<div class="text-gray-400 text-[10px]"><i class="fa-solid fa-user mr-1"></i>${t.assignee}</div>` : ''}
          ${t.due ? `<div class="text-gray-500 text-[10px]"><i class="fa-regular fa-calendar mr-1"></i>${t.due}</div>` : ''}
        </div>`).join('');
  });
}

function dragStart(id) { draggedTaskId = id; }
function dragEnd()     { draggedTaskId = null; document.querySelectorAll('[ondragover]').forEach(e => e.style.outline = ''); }
function dragOver(e)   { e.preventDefault(); e.currentTarget.style.outline = '2px dashed #facc15'; }
function drop(e, status) {
  e.preventDefault(); e.currentTarget.style.outline = '';
  if (!draggedTaskId) return;
  const t = tasksData.find(t => t.id === draggedTaskId);
  if (t) { t.status = status; saveTasks(); renderKanban(); }
}

function openAddTask() {
  editingTaskId = null;
  document.getElementById('modal-title').textContent = 'タスク追加';
  ['task-title','task-assignee','task-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('task-due').value = '';
  document.getElementById('task-priority').value = 'mid';
  document.getElementById('delete-task-btn').classList.add('hidden');
  document.getElementById('task-modal').classList.remove('hidden');
  document.getElementById('task-title').focus();
}
function openEditTask(id) {
  const t = tasksData.find(t => t.id === id); if (!t) return;
  editingTaskId = id;
  document.getElementById('modal-title').textContent = 'タスク編集';
  document.getElementById('task-title').value    = t.title;
  document.getElementById('task-assignee').value = t.assignee||'';
  document.getElementById('task-due').value      = t.due||'';
  document.getElementById('task-priority').value = t.priority||'mid';
  document.getElementById('task-note').value     = t.note||'';
  document.getElementById('delete-task-btn').classList.remove('hidden');
  document.getElementById('task-modal').classList.remove('hidden');
}
function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) { document.getElementById('task-title').focus(); return; }
  if (editingTaskId) {
    const t = tasksData.find(t => t.id === editingTaskId);
    if (t) { t.title = title; t.assignee = document.getElementById('task-assignee').value.trim(); t.due = document.getElementById('task-due').value; t.priority = document.getElementById('task-priority').value; t.note = document.getElementById('task-note').value.trim(); }
  } else {
    tasksData.push({ id:'task_'+Date.now(), title, assignee: document.getElementById('task-assignee').value.trim(), due: document.getElementById('task-due').value, priority: document.getElementById('task-priority').value, note: document.getElementById('task-note').value.trim(), status:'todo' });
  }
  saveTasks(); renderKanban(); closeModal();
}
function deleteTask() {
  if (!editingTaskId) return;
  tasksData = tasksData.filter(t => t.id !== editingTaskId);
  saveTasks(); renderKanban(); closeModal();
}
function closeModal() { document.getElementById('task-modal').classList.add('hidden'); editingTaskId = null; }
function saveTasks() { localStorage.setItem('mgmt_tasks', JSON.stringify(tasksData)); gasPost('tasks', tasksData); }
</script>
</body>
</html>
