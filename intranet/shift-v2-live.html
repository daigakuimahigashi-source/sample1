<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="refresh" content="0;url=./shift-v2-live7.html">
  <title>OKK シフトプランナー V2 - 最新版へ移動</title>
</head>
<body>
  <p>最新版へ移動しています…</p>
  <script>
    (() => {
      const target = new URL('./shift-v2-live7.html', window.location.href);
      target.searchParams.set('from', 'legacy-live');
      target.searchParams.set('v', Date.now().toString());
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
