<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKK シフトプランナー V2 - LIVE7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/shift-v2.css">
  <link rel="stylesheet" href="css/shift-v2-compliance.css">
  <link rel="stylesheet" href="css/shift-v2-audit.css">
  <style>
    #v2-live-boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f5f7fa;color:#344054;font-family:'Noto Sans JP',sans-serif}
    #v2-live-boot div{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:22px 28px;box-shadow:0 12px 36px rgba(16,24,40,.08);font-size:13px;font-weight:800}
    #v2-live-build{position:fixed;right:10px;bottom:10px;z-index:9998;padding:4px 7px;border-radius:999px;background:#101828;color:#fff;font:700 9px/1 sans-serif;opacity:.72;pointer-events:none}
  </style>
</head>
<body>
  <div id="v2-live-boot"><div>OKK シフトV2を起動中…</div></div>
  <script>
    (() => {
      const localScripts = [
        'shift-v2-observer-guard.js','shift-v2-data-bootstrap.js','shift-v2.js','shift-v2-compliance.js','shift-v2-time-summary.js','shift-v2-audit.js','shift-v2-staff-master.js','shift-v2-mf-staff-import.js','shift-v2-rules-bootstrap.js','shift-v2-rules.js','shift-v2-rules-restore.js','shift-v2-rules-safe-ui.js','shift-v2-rules-easy-entry.js','shift-v2-rules-direct-open.js','shift-v2-staff-constraints.js','shift-v2-work-plan.js','shift-v2-overtime-approval.js','shift-v2-holidays.js','shift-v2-requested-off.js','shift-v2-holiday-auto-guard.js','shift-v2-auto-placement.js','shift-v2-month-builder.js','shift-v2-requested-off-month-ui.js','shift-v2-month-prescribed.js','shift-v2-b-emergency.js','shift-v2-holiday-accounting.js','shift-v2-start-store-only.js','shift-v2-quarter-hour-editor.js','shift-v2-demo-mode.js','shift-v2-skill-hourly-matrix.js','shift-v2-browse-views.js','shift-v2-browse-gantt.js','shift-v2-mf-export.js','shift-v2-ui-layout.js','shift-v2-master-typography.js','shift-v2-guided-ui.js','shift-v2-go-live-check.js','shift-v2-repair-status.js','shift-v2-quick-add-guard.js','shift-v2-quick-add.js','shift-v2-month-shortage-presenter.js','shift-v2-month-decision-ui.js','shift-v2-master-readiness.js','shift-v2-stable-ui.js','shift-v2-staff-review.js','shift-v2-staff-review-layout-lock.js','shift-v2-summary-lock.js','shift-v2-need-review.js','shift-v2-inspector-delete-fix.js','shift-v2-edit-drawer-fix.js','shift-v2-access-control.js','shift-v2-skill-manager-controls.js','shift-v2-auth-gate.js'
      ];
      function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('読み込み失敗: '+src));document.body.appendChild(s);});}
      async function boot(){
        const response=await fetch('./shift-v2-template.html?v=live7bu-'+Date.now(),{cache:'no-store'});
        if(!response.ok) throw new Error('画面テンプレート HTTP '+response.status);
        const html=await response.text();
        const parsed=new DOMParser().parseFromString(html,'text/html');
        parsed.querySelectorAll('script').forEach(node=>node.remove());
        document.body.innerHTML=parsed.body.innerHTML;
        for(const file of localScripts){await loadScript('./js/'+file+'?v=live7bu');}
        const build=document.createElement('div');build.id='v2-live-build';build.textContent='LIVE7BU';document.body.appendChild(build);
        document.dispatchEvent(new Event('DOMContentLoaded',{bubbles:true}));
        const encoding=document.createElement('script');encoding.src='https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js';encoding.async=true;document.head.appendChild(encoding);
        if(localStorage.getItem('okk_shift_v2_demo_mode')==='1'){const status=document.getElementById('sync-status');if(status)status.textContent='デモ・クラウド同期OFF';window.shiftV2Cloud=null;window.shiftV2User=null;window.shiftV2IsAdmin=false;}else{setTimeout(loadFirebase,800);}
        setTimeout(checkReady,900);
      }
      function loadFirebase(){const module=document.createElement('script');module.type='module';module.textContent=`import { auth, loginWithGoogle, logout, isAdmin, onAuthStateChanged, fsGet, fsSet, fsListen, acquireEditorLease, renewEditorLease, releaseEditorLease, listenEditorLease } from './js/firebase-config.js?v=live7bu';window.shiftV2Cloud={get:fsGet,set:fsSet,listen:fsListen};window.shiftV2Login=()=>loginWithGoogle();window.shiftV2Logout=()=>logout();window.shiftV2EditorLease={acquire:acquireEditorLease,renew:renewEditorLease,release:releaseEditorLease,listen:listenEditorLease};listenEditorLease(lease=>document.dispatchEvent(new CustomEvent('shiftv2-editor-lease',{detail:{lease}})));onAuthStateChanged(auth,user=>{window.shiftV2User=user;window.shiftV2IsAdmin=isAdmin(user);document.dispatchEvent(new CustomEvent('shiftv2-auth',{detail:{user,admin:isAdmin(user)}}));});document.dispatchEvent(new Event('shiftv2-cloud-ready'));`;document.body.appendChild(module);}
      function checkReady(){const date=document.getElementById('work-date');const stores=document.getElementById('new-store-buttons');const canvas=document.getElementById('gantt-canvas');const status=document.getElementById('sync-status');if(date?.value&&stores?.children.length&&canvas?.children.length){return;}if(status){status.textContent='起動エラー';status.style.color='#f04438';}if(canvas&&!canvas.children.length){canvas.innerHTML='<div style="padding:24px;font-size:12px;color:#b42318"><strong>V2本体の初期化に失敗しました。</strong><br>この表示のスクリーンショットを送ってください。</div>';}}
      boot().catch(error=>{console.error(error);document.body.innerHTML=`<div style="padding:40px;font-family:sans-serif;color:#b42318"><h2>起動に失敗しました</h2><p>${String(error.message||error)}</p><p><a href="shift-v2.html">入口へ戻る</a></p></div>`;});
    })();
  </script>
</body>
</html>
