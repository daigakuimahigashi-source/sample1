<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>採用ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;font-size:14px;background:#f5f7fa;color:#444}

/* Header */
.top-header{background:#1a73e8;color:#fff;padding:10px 20px;display:flex;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top-title{font-size:17px;font-weight:700;letter-spacing:.5px}
.top-sync{margin-left:16px;font-size:11px;opacity:.75}

/* Stats bar */
.stats-bar{background:#fff;border-bottom:2px solid #e8edf5;padding:10px 20px;display:flex;align-items:center;gap:20px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.stat-box{text-align:center;min-width:70px}
.stat-num{font-size:26px;font-weight:800;color:#1a73e8;line-height:1.1}
.stat-label{font-size:12px;font-weight:700;color:#666;margin-top:2px}
.stat-divider{width:1px;height:42px;background:#e0e0e0;flex-shrink:0}
.today-box{margin-left:auto;text-align:right}
.today-date{font-size:22px;font-weight:700;color:#222;line-height:1.2}
.today-day{font-size:12px;color:#888;margin-top:1px}
.sync-info{font-size:10px;color:#bbb;text-align:right;margin-top:2px}

/* Table */
.table-wrap{padding:16px 20px;overflow-x:auto}
.table-outer{border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
table{border-collapse:collapse;background:#fff;width:100%;table-layout:fixed}
th,td{padding:6px 4px;text-align:center;border-bottom:2px solid #dde3f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{font-weight:700;font-size:11px;color:#444;border-bottom:2px solid #c8d0e0;background:#edf0f7}
thead tr:first-child th{font-size:12px;font-weight:800;letter-spacing:.3px;border-bottom:1px solid #c8d0e0}
thead tr:last-child th{border-bottom:3px solid #b0bcd8}
th.g-info{background:#e8eaef;color:#555}
th.g-sel{background:#dce4ff;color:#2a4fc0;border-bottom-color:#b0c0f0}
th.g-onb{background:#d4edda;color:#1a7a36;border-bottom-color:#90cfa0}
td{font-size:11px;vertical-align:middle;padding:14px 4px}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:none}
.td-name{text-align:left;font-weight:600;font-size:14px;padding-left:16px!important}
.td-name.is-active{border-left:4px solid #1a73e8;background:#f0f4ff}
.td-name.is-offered{border-left:4px solid #1e8e3e;background:#f0fdf4}
.td-name.is-joined{border-left:4px solid #888;background:#efefef;color:#888}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle}
.badge-active{background:#e8f0fe;color:#1a73e8}
.badge-offered{background:#e6f4ea;color:#1e8e3e}
tr.is-joined-row td.bg-sel .dr{opacity:.25}
tr.is-joined-row td.bg-onb .dc{opacity:.25;pointer-events:none;cursor:default}
tr.is-joined-row td.bg-onb .date-lbl{opacity:.25;pointer-events:none}
td.bg-info{background:#fafafa}
tbody tr:hover td.bg-info{background:#f0f0f0}

/* Stage cell */
.sc{display:flex;flex-direction:column;align-items:center;gap:2px}
.sd{font-size:9px;color:#aaa;line-height:1}

/* Read-only dot */
.dr{width:14px;height:14px;border-radius:50%;border:1.5px solid #ccc;display:inline-block;position:relative;vertical-align:middle;flex-shrink:0}
.dr.done{background:#1a73e8;border-color:#1a73e8}
.dr.ng{background:#d8d8d8;border-color:#bbb}
.dr.ng::after{content:'';position:absolute;top:50%;left:50%;width:125%;height:1.5px;background:#888;transform:translate(-50%,-50%) rotate(-45deg)}
.dr.pending{background:#fff;border-color:#ccc}

/* Clickable dot */
.dc{width:15px;height:15px;border-radius:50%;border:1.5px solid #bbb;display:inline-block;position:relative;vertical-align:middle;cursor:pointer;transition:transform .1s}
.dc:hover{transform:scale(1.18)}
.dc.locked{opacity:.25;cursor:not-allowed;pointer-events:none}
.s-p{background:#fff;border-color:#ccc}
.s-d{background:#1a73e8;border-color:#1a73e8}
.s-s{background:#d8d8d8;border-color:#bbb}
.s-s::after{content:'';position:absolute;top:50%;left:50%;width:125%;height:1.5px;background:#888;transform:translate(-50%,-50%) rotate(-45deg)}

/* Date under dot */
.date-wrap{position:relative;display:inline-block}
.date-lbl{font-size:9px;color:#888;border-bottom:1px dotted #ccc;min-width:26px;text-align:center;cursor:pointer;line-height:1.5;display:inline-block}
.date-lbl:empty::before{content:attr(data-ph);color:#ddd}
.date-lbl:hover{border-bottom-color:#1a73e8}
.date-hidden{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}

/* Phase column coloring */
td.bg-sel{background:#f0f4ff}
td.bg-onb{background:#f0fdf4}
tbody tr:hover td.bg-sel{background:#e8eeff}
tbody tr:hover td.bg-onb{background:#e6faf0}

/* Legend */
.legend{display:flex;align-items:center;gap:16px;padding:0 20px 16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#777}
.legend-note{font-size:10px;color:#bbb;margin-left:8px}

/* Controls */
.controls{background:#fff;border-bottom:1px solid #e8edf5;padding:7px 20px;display:flex;align-items:center;gap:10px}
.controls input{font-size:12px;padding:4px 10px;border:1px solid #ddd;border-radius:4px;height:28px;width:160px}
.controls select{font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;height:28px;color:#555;cursor:pointer}
.controls label{font-size:11px;color:#777}

/* Message */
.msg{text-align:center;padding:20px;color:#aaa;font-size:12px}
</style>
</head>
<body>

<div class="top-header">
  <div class="top-title">ミライト 採用ダッシュボード</div>
  <div class="top-sync" id="sync-info">読み込み中...</div>
</div>

<div class="stats-bar">
  <div class="stat-box">
    <div class="stat-num" id="s-total">-</div>
    <div class="stat-label">候補者</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-box">
    <div class="stat-num" id="s-active">-</div>
    <div class="stat-label">選考中</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-box">
    <div class="stat-num" id="s-offer">-</div>
    <div class="stat-label">手続中</div>
  </div>
  <div class="today-box" id="today-box"></div>
</div>

<div class="controls">
  <label>絞り込み</label>
  <input type="text" id="search-input" placeholder="氏名で検索..." oninput="applyFilter()">
  <label>表示</label>
  <select id="filter-status" onchange="applyFilter()">
    <option value="all">全員</option>
    <option value="active">選考中のみ</option>
    <option value="offered">手続中のみ</option>
  </select>
  <select id="filter-joined" onchange="applyFilter()">
    <option value="exclude">入社済み除く</option>
    <option value="include">入社済み含む</option>
  </select>
  <label>並び替え</label>
  <select id="sort-order" onchange="applyFilter()">
    <option value="default">選考中→手続中</option>
    <option value="reverse">手続中→選考中</option>
  </select>
</div>

<div class="table-wrap">
  <div class="table-outer">
  <table id="main-table">
    <colgroup>
      <col style="width:180px">
      <col><col><col><col><col>
      <col><col><col><col><col>
      <col><col><col><col><col><col><col><col><col><col><col><col>
      <col>
    </colgroup>
    <thead>
      <tr>
        <th rowspan="2" class="g-info" style="text-align:left;padding-left:16px">氏名</th>
        <th colspan="5" class="g-info">基本情報</th>
        <th colspan="5" class="g-sel">採用</th>
        <th colspan="12" class="g-onb">入社手続</th>
        <th rowspan="2" style="background:#f5f5f5;color:#888;font-weight:700">入社</th>
      </tr>
      <tr>
        <th>年齢</th><th>性別</th><th>就業<br>状況</th><th>流入<br>経路</th><th>応募日</th>
        <th>書類</th><th>1次<br>面接</th><th>最終<br>面接</th><th>内定<br>通知</th><th>内定<br>承諾</th>
        <th>アドレス<br>確認</th><th>Slack<br>追加</th><th>奨学金<br>確認</th><th>人事管理<br>入力依頼</th><th>人事管理<br>入力</th><th>給与<br>設定</th><th>雇用<br>契約書</th><th>社保<br>加入</th><th>雇用保険<br>加入</th><th>市府民税<br>特別徴収</th><th>市府民税<br>納付書</th><th>入社<br>誓約書</th>
      </tr>
    </thead>
    <tbody id="main-tbody">
      <tr><td colspan="24" class="msg">読み込み中...</td></tr>
    </tbody>
  </table>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><span class="dc s-d"></span> 完了</div>
  <div class="legend-item"><span class="dc s-s"></span> スキップ（2回押し）</div>
  <div class="legend-item"><span class="dc s-p"></span> 未実施</div>
  <span class="legend-note">採用フェーズはスプシから自動取得（読み取り専用）／入社手続はここで管理・保存</span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC849vt6ia6qSK-9vEfMXP8hP6R6G2N27E",
  authDomain: "miraito-saiyou.firebaseapp.com",
  databaseURL: "https://miraito-saiyou-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "miraito-saiyou",
  storageBucket: "miraito-saiyou.firebasestorage.app",
  messagingSenderId: "979218386068",
  appId: "1:979218386068:web:69f763f395ce1291cf7881"
};
const db = getDatabase(initializeApp(firebaseConfig));
const onboardRef = ref(db, 'onboarding');

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTlQPAVIIeb_QG2tPxu8-mfL5RP47ZpGe-BmDsTwKMmB_lY8MYqNJa_pJJrymdLumokQ/exec';

const OSTAGES = [
  {id:'o1',label:'アドレス<br>確認'},
  {id:'o2',label:'Slack<br>追加'},
  {id:'o3',label:'奨学金<br>確認'},
  {id:'o4',label:'人事管理<br>入力依頼'},
  {id:'o5',label:'人事管理<br>入力'},
  {id:'o6',label:'給与<br>設定'},
  {id:'o7',label:'雇用<br>契約書'},
  {id:'o8',label:'社保<br>加入'},
  {id:'o9',label:'雇用保険<br>加入'},
  {id:'o10',label:'市府民税<br>特別徴収'},
  {id:'o11',label:'市府民税<br>納付書'},
  {id:'o12',label:'入社<br>誓約書'},
];
const CYCLE = ['pending','done','skip'];
const DC = {pending:'s-p',done:'s-d',skip:'s-s'};

let sheetsData = [];
let onboardData = {};

// Firebase listener
onValue(onboardRef, snap => {
  onboardData = snap.val() || {};
  render();
});

function saveOnboard() { set(onboardRef, onboardData); }

// Load Sheets
async function loadSheets() {
  document.getElementById('sync-info').textContent = '取得中...';
  try {
    const res = await fetch(SCRIPT_URL);
    sheetsData = await res.json();
    render();
    const n = new Date();
    const days = ['日','月','火','水','木','金','土'];
    document.getElementById('sync-info').textContent =
      `最終更新 ${n.getMonth()+1}/${n.getDate()}（${days[n.getDay()]}）${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;
  } catch(e) {
    document.getElementById('sync-info').textContent = 'エラー: ' + e.message;
  }
}

// Filter & sort
window.applyFilter = function() { render(); };

// Render
function render() {
  const allBase = sheetsData.filter(c => c.status.startsWith('02_') || c.status.startsWith('11_'));
  const active  = allBase.filter(c => c.status.startsWith('02_') && !onboardData[c.id]?.joined);
  const offered = allBase.filter(c => c.status.startsWith('11_') && !onboardData[c.id]?.joined);
  document.getElementById('s-total').textContent = active.length + offered.length;
  document.getElementById('s-active').textContent = active.length;
  document.getElementById('s-offer').textContent = offered.length;

  const keyword      = (document.getElementById('search-input')?.value || '').trim();
  const statusFilter = document.getElementById('filter-status')?.value || 'all';
  const sortOrder    = document.getElementById('sort-order')?.value || 'default';
  const showJoined   = document.getElementById('filter-joined')?.value === 'include';

  let all = showJoined ? [...allBase] : allBase.filter(c => !onboardData[c.id]?.joined);
  if (statusFilter === 'active')  all = all.filter(c => c.status.startsWith('02_'));
  else if (statusFilter === 'offered') all = all.filter(c => c.status.startsWith('11_'));
  if (keyword) all = all.filter(c => c.name.includes(keyword));
  if (sortOrder === 'reverse') all.sort((a,b) => (b.status.startsWith('11_')?1:0)-(a.status.startsWith('11_')?1:0));
  else all.sort((a,b) => (a.status.startsWith('11_')?1:0)-(b.status.startsWith('11_')?1:0));

  const tbody = document.getElementById('main-tbody');
  if (all.length === 0) {
    tbody.innerHTML = '<tr><td colspan="32" class="msg">データがありません</td></tr>';
    return;
  }

  tbody.innerHTML = all.map(c => {
    const isOffered = c.status.startsWith('11_');
    const od = onboardData[c.id] || {};
    const stages = od.stages || {};
    const isJoined = !!od.joined;
    const allDone = isOffered && OSTAGES.every(s => { const st = stages[s.id]||'pending'; return st==='done'||st==='skip'; });

    const infoCells = [
      `<td class="bg-info">${esc(c.age)}</td>`,
      `<td class="bg-info">${esc(c.gender)}</td>`,
      `<td class="bg-info" style="font-size:10px">${esc(c.work)}</td>`,
      `<td class="bg-info" style="font-size:10px">${esc(c.source)}</td>`,
      `<td class="bg-info" style="font-size:10px">${esc(fmtDate(c.applyDate||''))}</td>`,
    ].join('');

    const selCells = [
      `<td class="bg-sel"><div class="sc">${drDot(c.doc.result)}</div></td>`,
      `<td class="bg-sel"><div class="sc">${drDot(c.int1.result)}</div></td>`,
      `<td class="bg-sel"><div class="sc">${drDot(c.final.result)}</div></td>`,
      `<td class="bg-sel"><div class="sc">${drDot(c.offer.result)}</div></td>`,
      `<td class="bg-sel"><div class="sc">${isOffered?'<span class="dr done"></span>':'<span class="dr pending"></span>'}</div></td>`,
    ].join('');

    const onbCells = OSTAGES.map(s => {
      if (!isOffered) return `<td class="bg-onb"><span class="dc s-p locked"></span></td>`;
      const st = stages[s.id] || 'pending';
      return `<td class="bg-onb"><div class="sc">
        <span class="dc ${DC[st]}" data-id="${esc(c.id)}" data-sid="${s.id}" onclick="cycleDot(this)"></span>
        <div class="date-wrap">
          <span class="date-lbl" data-ph="日付">${esc(od.dates&&od.dates[s.id]||'')}</span>
          <input class="date-hidden" type="date" data-id="${esc(c.id)}" data-sid="${s.id}" onchange="saveDate(this)">
        </div>
      </div></td>`;
    }).join('');

    const joinLocked = !isJoined && !allDone;
    const joinTitle = isJoined ? '入社済み（クリックで解除）' : allDone ? 'クリックで入社済みにする' : '全手続き完了後に押せます';
    const joinCell = `<td style="background:#f9f9f9">
      <span class="dc ${isJoined?'s-d':'s-p'}${joinLocked?' locked':''}" data-id="${esc(c.id)}" onclick="toggleJoined(this)" title="${joinTitle}"></span>
    </td>`;

    const nameBadge = isJoined
      ? `<span class="badge" style="background:#ddd;color:#888">入社済</span>`
      : isOffered
        ? `<span class="badge badge-offered">内定</span>`
        : `<span class="badge badge-active">選考中</span>`;

    const nameCls = isJoined ? 'td-name is-joined' : `td-name is-${isOffered?'offered':'active'}`;

    return `<tr class="${isJoined?'is-joined-row':''}">
      <td class="${nameCls}">${esc(c.name)}${nameBadge}</td>
      ${infoCells}${selCells}${onbCells}${joinCell}
    </tr>`;
  }).join('');

}

window.toggleJoined = function(el) {
  const id = el.dataset.id;
  if (!onboardData[id]) onboardData[id] = {};
  onboardData[id].joined = !onboardData[id].joined;
  saveOnboard();
  render();
};

window.cycleDot = function(el) {
  const id = el.dataset.id, sid = el.dataset.sid;
  if (!onboardData[id]) onboardData[id] = {};
  if (!onboardData[id].stages) onboardData[id].stages = {};
  const cur = onboardData[id].stages[sid] || 'pending';
  const next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
  onboardData[id].stages[sid] = next;
  el.className = `dc ${DC[next]}`;
  saveOnboard();
};

window.saveDate = function(input) {
  const id = input.dataset.id, sid = input.dataset.sid;
  if (!input.value) return;
  const p = input.value.split('-');
  const mmdd = `${parseInt(p[1])}/${parseInt(p[2])}`;
  if (!onboardData[id]) onboardData[id] = {};
  if (!onboardData[id].dates) onboardData[id].dates = {};
  onboardData[id].dates[sid] = mmdd;
  const lbl = input.previousElementSibling;
  if (lbl) lbl.textContent = mmdd;
  saveOnboard();
};

function drDot(result) {
  if (!result) return '<span class="dr pending"></span>';
  const r = String(result).trim();
  if (r === '○') return '<span class="dr done"></span>';
  if (r.includes('お見送り') || r === '×' || r.includes('辞退')) return '<span class="dr ng"></span>';
  return '<span class="dr pending"></span>';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(s) {
  if (!s) return '';
  const m = String(s).match(/^(\d{4})[-\/](\d{2})[-\/](\d{2})/);
  if (m) return `${parseInt(m[2])}/${parseInt(m[3])}`;
  return s;
}

(function(){
  const d = new Date(), days = ['日','月','火','水','木','金','土'];
  document.getElementById('today-box').innerHTML =
    `<div class="today-date">${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）</div>
     <div class="today-day">${d.getFullYear()}年</div>`;
})();


loadSheets();
setInterval(loadSheets, 5 * 60 * 1000);
</script>
</body>
</html>
