<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKK シフトプランナー V2</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f5f7fa;color:#344054}

  </style>
  <script>
    (() => {
      const target = './shift-v2-app.html' + location.search + location.hash;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="entry"><div class="card"><strong>OKK シフトプランナーを起動しています</strong><span>自動で切り替わらない場合は下のリンクを押してください。</span><a href="shift-v2-app.html">シフトプランナーを開く</a></div></div>

</html>
