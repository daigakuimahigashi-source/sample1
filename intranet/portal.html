<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>焼肉ここから | グループポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>body{font-family:'Noto Sans JP',sans-serif}.progress-bar{transition:width 1s cubic-bezier(.4,0,.2,1)}</style>
</head>
<body class="bg-gray-950 min-h-screen text-white">
<header class="flex justify-between items-center px-6 md:px-10 py-4 border-b border-gray-800">
  <div class="flex items-center gap-3"><img src="img/logo.png" alt="焼肉ここから" class="h-9"><div><div class="font-black text-base text-yellow-400">沖縄ここから</div></div></div>
  <div class="flex items-center gap-3"><span id="today-date" class="text-xs text-gray-500 hidden md:block"></span><a href="management.html" class="border border-yellow-800 hover:border-yellow-400 bg-yellow-950/40 hover:bg-yellow-900/30 px-3 py-1.5 rounded-lg text-xs flex items-center gap-2 transition-all duration-200 text-yellow-400 hover:text-yellow-300"><i class="fa-solid fa-shield-halved"></i><span>経営ダッシュボード</span></a><button onclick="toggleAdminLogin()" id="admin-login-btn" class="border border-gray-700 hover:border-yellow-400/50 px-3 py-1.5 rounded-lg text-xs flex items-center gap-2 transition-all duration-200"><i class="fa-solid fa-lock text-gray-500 transition" id="lock-icon"></i><span id="admin-status-label" class="text-gray-400 transition">経営者ログイン</span></button></div>
</header>
<section class="px-6 md:px-10 py-12 md:py-16 text-center border-b border-gray-800/50"><div class="text-[10px] text-yellow-400 font-bold tracking-[0.4em] mb-5 uppercase">Today's Mission</div><p id="monthly-message" class="text-2xl md:text-4xl font-black text-white leading-snug max-w-2xl mx-auto"></p><div id="today-display" class="mt-4 text-gray-600 text-sm"></div><button onclick="editMessage()" id="edit-msg-btn" class="hidden mt-5 text-xs text-yellow-400 hover:text-yellow-300 border border-yellow-900 hover:border-yellow-400 px-4 py-1.5 rounded-full transition"><i class="fa-solid fa-pen mr-1"></i>メッセージを編集</button></section>
<section class="px-6 md:px-10 py-8 border-b border-gray-800/50"><div class="flex justify-between items-center mb-5"><h2 class="text-[11px] font-bold text-gray-500 uppercase tracking-widest"><i class="fa-solid fa-bullseye mr-2 text-yellow-400"></i>今月の目標<span id="month-label" class="ml-2 text-gray-700 font-normal normal-case tracking-normal"></span></h2><button onclick="editGoals()" id="edit-goals-btn" class="hidden text-xs text-yellow-400 hover:text-yellow-300 border border-yellow-900 hover:border-yellow-400 px-3 py-1 rounded-full transition"><i class="fa-solid fa-pen mr-1"></i>目標を編集</button></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4" id="store-goals-grid"></div><div class="grid grid-cols-2 gap-3" id="rate-goals-grid"></div></section>
<section class="px-6 md:px-10 py-8"><h2 class="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-5"><i class="fa-solid fa-grip mr-2"></i>メニュー</h2><div class="grid grid-cols-2 md:grid-cols-3 gap-3"><a href="index.html" class="block bg-gray-900 hover:bg-gray-800 border border-gray-800 hover:border-amber-700/50 rounded-2xl p-5 transition-all group"><i class="fa-solid fa-chart-line text-2xl text-yellow-400 mb-3 block group-hover:scale-110 transition-transform origin-left"></i><div class="font-bold text-sm text-white">売上ダッシュボード</div><div class="text-[11px] text-gray-600 mt-1">日次・月次・店舗別売上</div></a><a href="shift-simple-cloud.html" class="block bg-gray-900 hover:bg-gray-800 border border-gray-800 hover:border-blue-700/50 rounded-2xl p-5 transition-all group"><i class="fa-solid fa-calendar-days text-2xl text-blue-400 mb-3 block group-hover:scale-110 transition-transform origin-left"></i><div class="font-bold text-sm text-white">シフト管理</div><div class="text-[11px] text-gray-600 mt-1">ガント入力・自動補完・公開・MF CSV</div></a><div class="bg-gray-950 border border-gray-800 border-dashed rounded-2xl p-5 opacity-30 select-none"><i class="fa-solid fa-hammer text-2xl text-gray-700 mb-3 block"></i><div class="font-bold text-sm text-gray-600">準備中</div><div class="text-[11px] text-gray-700 mt-1">今後追加予定</div></div></div></section>
<footer class="border-t border-gray-900 px-6 md:px-10 py-4 text-center text-[10px] text-gray-700">© 株式会社沖縄ここから グループ</footer>
<div id="pw-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden"><div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-sm shadow-2xl mx-4"><div class="text-center mb-6"><div class="w-14 h-14 bg-yellow-400/10 border border-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-lock text-yellow-400 text-2xl"></i></div><h3 class="font-black text-white text-lg">経営者ログイン</h3><p class="text-gray-500 text-xs mt-1">パスワードを入力してください</p></div><input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitPassword()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-center text-lg tracking-[0.3em] focus:outline-none focus:border-amber-400 mb-2 transition"><p id="pw-error" class="text-red-400 text-xs text-center mb-4 hidden">パスワードが違います</p><div class="flex gap-3"><button onclick="closePwModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-sm transition">キャンセル</button><button onclick="submitPassword()" class="flex-1 bg-yellow-400 hover:bg-amber-400 text-gray-900 font-black rounded-xl px-4 py-2.5 text-sm transition">ログイン</button></div></div></div>
<div id="msg-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden"><div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-lg shadow-2xl mx-4"><h3 class="font-bold text-white mb-1"><i class="fa-solid fa-pen mr-2 text-yellow-400"></i>今月のメッセージ</h3><p class="text-xs text-gray-500 mb-4">改行はそのまま反映されます</p><textarea id="msg-input" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 resize-none mb-4 text-sm transition"></textarea><div class="flex gap-3 justify-end"><button onclick="document.getElementById('msg-modal').classList.add('hidden')" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 px-4 py-2 rounded-xl text-sm transition">キャンセル</button><button onclick="saveMessage()" class="bg-yellow-400 hover:bg-amber-400 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm transition">保存</button></div></div></div>
<div id="goals-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden"><div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-lg shadow-2xl mx-4 max-h-[90vh] overflow-y-auto"><h3 class="font-bold text-white mb-5"><i class="fa-solid fa-pen mr-2 text-yellow-400"></i>目標を編集</h3><div class="space-y-2 mb-5" id="goals-form"></div><div class="flex gap-3 justify-end"><button onclick="document.getElementById('goals-modal').classList.add('hidden')" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 px-4 py-2 rounded-xl text-sm transition">キャンセル</button><button onclick="saveGoals()" class="bg-yellow-400 hover:bg-amber-400 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm transition">保存</button></div></div></div>
<script>
const ADMIN_PW='okk2025';
const GAS_URL='https://script.google.com/macros/s/AKfycbykLuUaDsP2vbsSh73Vm1Kh70nuxsZMoC5_U9m7p0WyTtIaGshNy98rmmsStH46xoA/exec';
const DEFAULT_GOALS={message:'今月も全店一丸で\n目標を達成しよう！',stores:{matsuyama:{name:'松山店',target:2000000},kumoji:{name:'久茂地店',target:1500000},miebash:{name:'美栄橋店',target:1200000},misato:{name:'美里店',target:800000}},fRate:30,lRate:25};
let isAdmin=sessionStorage.getItem('okk_admin')==='1';
let goals=(()=>{try{return JSON.parse(localStorage.getItem('okk_goals'))||null}catch{return null}})()||JSON.parse(JSON.stringify(DEFAULT_GOALS));
let salesActuals={};
function init(){const now=new Date(),WDAYS=['日','月','火','水','木','金','土'],dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WDAYS[now.getDay()]}）`;document.getElementById('today-date').textContent=dateStr;document.getElementById('today-display').textContent=dateStr;document.getElementById('month-label').textContent=`${now.getFullYear()}年${now.getMonth()+1}月度`;updateAdminUI();renderMessage();renderGoals();fetchSales();}
function toggleAdminLogin(){if(isAdmin){sessionStorage.removeItem('okk_admin');isAdmin=false;updateAdminUI();renderGoals();}else{document.getElementById('pw-modal').classList.remove('hidden');setTimeout(()=>document.getElementById('pw-input').focus(),80);}}
function closePwModal(){document.getElementById('pw-modal').classList.add('hidden');document.getElementById('pw-input').value='';document.getElementById('pw-error').classList.add('hidden');}
function submitPassword(){if(document.getElementById('pw-input').value===ADMIN_PW){sessionStorage.setItem('okk_admin','1');isAdmin=true;closePwModal();updateAdminUI();renderGoals();}else{document.getElementById('pw-error').classList.remove('hidden');document.getElementById('pw-input').value='';document.getElementById('pw-input').focus();}}
function updateAdminUI(){const btn=document.getElementById('admin-login-btn'),icon=document.getElementById('lock-icon'),label=document.getElementById('admin-status-label');if(isAdmin){btn.classList.add('border-yellow-400/40','bg-yellow-400/5');icon.className='fa-solid fa-lock-open text-yellow-400 transition';label.className='text-yellow-400 transition text-xs';label.textContent='経営者モード ON（ログアウト）';}else{btn.classList.remove('border-yellow-400/40','bg-yellow-400/5');icon.className='fa-solid fa-lock text-gray-500 transition';label.className='text-gray-400 transition text-xs';label.textContent='経営者ログイン';}document.getElementById('edit-msg-btn').classList.toggle('hidden',!isAdmin);document.getElementById('edit-goals-btn').classList.toggle('hidden',!isAdmin);}
function renderMessage(){document.getElementById('monthly-message').innerHTML=goals.message.replace(/\n/g,'<br>');}
function editMessage(){document.getElementById('msg-input').value=goals.message;document.getElementById('msg-modal').classList.remove('hidden');}
function saveMessage(){goals.message=document.getElementById('msg-input').value;persistGoals();renderMessage();document.getElementById('msg-modal').classList.add('hidden');}
function renderGoals(){const storeGrid=document.getElementById('store-goals-grid');storeGrid.innerHTML=Object.entries(goals.stores).map(([key,s])=>{const actual=salesActuals[key]||0,pct=s.target?Math.min(100,Math.round(actual/s.target*100)):0;return`<div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><div class="text-xs text-gray-400">${s.name}</div><div class="font-black text-lg mt-1">¥${Number(actual).toLocaleString()}</div><div class="text-[10px] text-gray-600 mt-1">目標 ¥${Number(s.target).toLocaleString()}</div><div class="h-1.5 bg-gray-800 rounded-full mt-3 overflow-hidden"><div class="progress-bar h-full bg-yellow-400 rounded-full" style="width:${pct}%"></div></div><div class="text-right text-[10px] text-gray-500 mt-1">${pct}%</div></div>`}).join('');document.getElementById('rate-goals-grid').innerHTML=`<div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><div class="text-xs text-gray-400">F率目標</div><div class="font-black text-2xl text-yellow-400 mt-1">${goals.fRate}%</div></div><div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><div class="text-xs text-gray-400">L率目標</div><div class="font-black text-2xl text-blue-400 mt-1">${goals.lRate}%</div></div>`;}
function editGoals(){const f=document.getElementById('goals-form');f.innerHTML=Object.entries(goals.stores).map(([k,s])=>`<label class="flex items-center justify-between gap-3 text-xs text-gray-300"><span>${s.name}</span><input data-goal-store="${k}" type="number" value="${s.target}" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 w-40 text-right"></label>`).join('')+`<label class="flex items-center justify-between gap-3 text-xs text-gray-300"><span>F率</span><input id="goal-frate" type="number" value="${goals.fRate}" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 w-40 text-right"></label><label class="flex items-center justify-between gap-3 text-xs text-gray-300"><span>L率</span><input id="goal-lrate" type="number" value="${goals.lRate}" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 w-40 text-right"></label>`;document.getElementById('goals-modal').classList.remove('hidden');}
function saveGoals(){document.querySelectorAll('[data-goal-store]').forEach(i=>goals.stores[i.dataset.goalStore].target=Number(i.value)||0);goals.fRate=Number(document.getElementById('goal-frate').value)||0;goals.lRate=Number(document.getElementById('goal-lrate').value)||0;persistGoals();renderGoals();document.getElementById('goals-modal').classList.add('hidden');}
function persistGoals(){localStorage.setItem('okk_goals',JSON.stringify(goals));}
async function fetchSales(){try{const r=await fetch(GAS_URL);const d=await r.json();if(d&&d.stores)salesActuals=d.stores;renderGoals();}catch(e){console.warn('sales fetch failed',e);}}
init();
</script>
</body>
</html>
