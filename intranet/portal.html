<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>焼肉ここから | グループポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .progress-bar { transition: width 1s cubic-bezier(0.4,0,0.2,1); }
  </style>
</head>
<body class="bg-gray-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="flex justify-between items-center px-6 md:px-10 py-4 border-b border-gray-800">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-amber-500 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/30">
        <i class="fa-solid fa-fire text-white text-sm"></i>
      </div>
      <div>
        <div class="font-black text-base">焼肉ここから グループ</div>
        <div class="text-[10px] text-gray-500">株式会社沖縄ここから</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="today-date" class="text-xs text-gray-500 hidden md:block"></span>
      <button onclick="toggleAdminLogin()" id="admin-login-btn"
        class="border border-gray-700 hover:border-yellow-400/50 px-3 py-1.5 rounded-lg text-xs flex items-center gap-2 transition-all duration-200">
        <i class="fa-solid fa-lock text-gray-500 transition" id="lock-icon"></i>
        <span id="admin-status-label" class="text-gray-400 transition">経営者ログイン</span>
      </button>
    </div>
  </header>

  <!-- HERO MESSAGE -->
  <section class="px-6 md:px-10 py-12 md:py-16 text-center border-b border-gray-800/50">
    <div class="text-[10px] text-yellow-400 font-bold tracking-[0.4em] mb-5 uppercase">Today's Mission</div>
    <p id="monthly-message" class="text-2xl md:text-4xl font-black text-white leading-snug max-w-2xl mx-auto"></p>
    <div id="today-display" class="mt-4 text-gray-600 text-sm"></div>
    <button onclick="editMessage()" id="edit-msg-btn"
      class="hidden mt-5 text-xs text-yellow-400 hover:text-yellow-300 border border-yellow-900 hover:border-yellow-400 px-4 py-1.5 rounded-full transition">
      <i class="fa-solid fa-pen mr-1"></i>メッセージを編集
    </button>
  </section>

  <!-- GOALS -->
  <section class="px-6 md:px-10 py-8 border-b border-gray-800/50">
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-[11px] font-bold text-gray-500 uppercase tracking-widest">
        <i class="fa-solid fa-bullseye mr-2 text-yellow-400"></i>今月の目標
        <span id="month-label" class="ml-2 text-gray-700 font-normal normal-case tracking-normal"></span>
      </h2>
      <button onclick="editGoals()" id="edit-goals-btn"
        class="hidden text-xs text-yellow-400 hover:text-yellow-300 border border-yellow-900 hover:border-yellow-400 px-3 py-1 rounded-full transition">
        <i class="fa-solid fa-pen mr-1"></i>目標を編集
      </button>
    </div>

    <!-- 店舗別売上目標 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4" id="store-goals-grid"></div>

    <!-- F率・L率 -->
    <div class="grid grid-cols-2 gap-3" id="rate-goals-grid"></div>
  </section>

  <!-- NAVIGATION MENU -->
  <section class="px-6 md:px-10 py-8">
    <h2 class="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-5">
      <i class="fa-solid fa-grip mr-2"></i>メニュー
    </h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <a href="index.html"
        class="block bg-gray-900 hover:bg-gray-800 border border-gray-800 hover:border-amber-700/50 rounded-2xl p-5 transition-all group">
        <i class="fa-solid fa-chart-line text-2xl text-yellow-400 mb-3 block group-hover:scale-110 transition-transform origin-left"></i>
        <div class="font-bold text-sm text-white">売上ダッシュボード</div>
        <div class="text-[11px] text-gray-600 mt-1">日次・月次・店舗別売上</div>
      </a>
      <a href="shift.html"
        class="block bg-gray-900 hover:bg-gray-800 border border-gray-800 hover:border-blue-700/50 rounded-2xl p-5 transition-all group">
        <i class="fa-solid fa-calendar-days text-2xl text-blue-400 mb-3 block group-hover:scale-110 transition-transform origin-left"></i>
        <div class="font-bold text-sm text-white">シフト管理</div>
        <div class="text-[11px] text-gray-600 mt-1">配置・労務・給与計算</div>
      </a>
      <div class="bg-gray-950 border border-gray-800 border-dashed rounded-2xl p-5 opacity-30 select-none">
        <i class="fa-solid fa-hammer text-2xl text-gray-700 mb-3 block"></i>
        <div class="font-bold text-sm text-gray-600">準備中</div>
        <div class="text-[11px] text-gray-700 mt-1">今後追加予定</div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="border-t border-gray-900 px-6 md:px-10 py-4 text-center text-[10px] text-gray-700">
    © 株式会社沖縄ここから グループ
  </footer>

  <!-- ===== MODALS ===== -->

  <!-- Password Modal -->
  <div id="pw-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-sm shadow-2xl mx-4">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fa-solid fa-lock text-yellow-400 text-2xl"></i>
        </div>
        <h3 class="font-black text-white text-lg">経営者ログイン</h3>
        <p class="text-gray-500 text-xs mt-1">パスワードを入力してください</p>
      </div>
      <input type="password" id="pw-input" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')submitPassword()"
        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-center text-lg tracking-[0.3em] focus:outline-none focus:border-amber-400 mb-2 transition">
      <p id="pw-error" class="text-red-400 text-xs text-center mb-4 hidden">パスワードが違います</p>
      <div class="flex gap-3">
        <button onclick="closePwModal()"
          class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-sm transition">
          キャンセル
        </button>
        <button onclick="submitPassword()"
          class="flex-1 bg-amber-500 hover:bg-amber-400 text-gray-900 font-black rounded-xl px-4 py-2.5 text-sm transition">
          ログイン
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Message Modal -->
  <div id="msg-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-lg shadow-2xl mx-4">
      <h3 class="font-bold text-white mb-1"><i class="fa-solid fa-pen mr-2 text-yellow-400"></i>今月のメッセージ</h3>
      <p class="text-xs text-gray-500 mb-4">改行はそのまま反映されます</p>
      <textarea id="msg-input" rows="4"
        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 resize-none mb-4 text-sm transition"></textarea>
      <div class="flex gap-3 justify-end">
        <button onclick="document.getElementById('msg-modal').classList.add('hidden')"
          class="bg-gray-700 hover:bg-gray-600 border border-gray-600 px-4 py-2 rounded-xl text-sm transition">
          キャンセル
        </button>
        <button onclick="saveMessage()"
          class="bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm transition">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Goals Modal -->
  <div id="goals-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-lg shadow-2xl mx-4 max-h-[90vh] overflow-y-auto">
      <h3 class="font-bold text-white mb-5"><i class="fa-solid fa-pen mr-2 text-yellow-400"></i>目標を編集</h3>
      <div class="space-y-2 mb-5" id="goals-form"></div>
      <div class="flex gap-3 justify-end">
        <button onclick="document.getElementById('goals-modal').classList.add('hidden')"
          class="bg-gray-700 hover:bg-gray-600 border border-gray-600 px-4 py-2 rounded-xl text-sm transition">
          キャンセル
        </button>
        <button onclick="saveGoals()"
          class="bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm transition">
          保存
        </button>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    // パスワードを変更する場合はここを編集
    const ADMIN_PW = 'okk2025';
    const GAS_URL  = 'https://script.google.com/macros/s/AKfycbykLuUaDsP2vbsSh73Vm1Kh70nuxsZMoC5_U9m7p0WyTtIaGshNy98rmmsStH46xoA/exec';

    const DEFAULT_GOALS = {
      message: '今月も全店一丸で\n目標を達成しよう！',
      stores: {
        matsuyama: { name: '松山店',   target: 2000000 },
        kumoji:    { name: '久茂地店', target: 1500000 },
        miebash:   { name: '美栄橋店', target: 1200000 },
        misato:    { name: '美里店',   target:  800000 },
      },
      fRate: 30,
      lRate: 25,
    };

    // ===== State =====
    let isAdmin = sessionStorage.getItem('okk_admin') === '1';
    let goals   = (() => {
      try { return JSON.parse(localStorage.getItem('okk_goals')) || null; } catch { return null; }
    })() || JSON.parse(JSON.stringify(DEFAULT_GOALS));
    let salesActuals = {};

    // ===== Init =====
    function init() {
      const now = new Date();
      const WDAYS = ['日','月','火','水','木','金','土'];
      const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WDAYS[now.getDay()]}）`;
      document.getElementById('today-date').textContent   = dateStr;
      document.getElementById('today-display').textContent = dateStr;
      document.getElementById('month-label').textContent  = `${now.getFullYear()}年${now.getMonth()+1}月度`;

      updateAdminUI();
      renderMessage();
      renderGoals();
      fetchSales();
    }

    // ===== Admin =====
    function toggleAdminLogin() {
      if (isAdmin) {
        sessionStorage.removeItem('okk_admin');
        isAdmin = false;
        updateAdminUI();
        renderGoals();
      } else {
        document.getElementById('pw-modal').classList.remove('hidden');
        setTimeout(() => document.getElementById('pw-input').focus(), 80);
      }
    }

    function closePwModal() {
      document.getElementById('pw-modal').classList.add('hidden');
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-error').classList.add('hidden');
    }

    function submitPassword() {
      if (document.getElementById('pw-input').value === ADMIN_PW) {
        sessionStorage.setItem('okk_admin', '1');
        isAdmin = true;
        closePwModal();
        updateAdminUI();
        renderGoals();
      } else {
        document.getElementById('pw-error').classList.remove('hidden');
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
      }
    }

    function updateAdminUI() {
      const btn   = document.getElementById('admin-login-btn');
      const icon  = document.getElementById('lock-icon');
      const label = document.getElementById('admin-status-label');
      if (isAdmin) {
        btn.classList.add('border-yellow-400/40', 'bg-yellow-400/5');
        icon.className  = 'fa-solid fa-lock-open text-yellow-400 transition';
        label.className = 'text-yellow-400 transition text-xs';
        label.textContent = '経営者モード ON（ログアウト）';
      } else {
        btn.classList.remove('border-yellow-400/40', 'bg-yellow-400/5');
        icon.className  = 'fa-solid fa-lock text-gray-500 transition';
        label.className = 'text-gray-400 transition text-xs';
        label.textContent = '経営者ログイン';
      }
      document.getElementById('edit-msg-btn').classList.toggle('hidden', !isAdmin);
      document.getElementById('edit-goals-btn').classList.toggle('hidden', !isAdmin);
    }

    // ===== Message =====
    function renderMessage() {
      document.getElementById('monthly-message').innerHTML =
        goals.message.replace(/\n/g, '<br>');
    }

    function editMessage() {
      document.getElementById('msg-input').value = goals.message;
      document.getElementById('msg-modal').classList.remove('hidden');
    }

    function saveMessage() {
      const val = document.getElementById('msg-input').value.trim();
      if (val) goals.message = val;
      localStorage.setItem('okk_goals', JSON.stringify(goals));
      renderMessage();
      document.getElementById('msg-modal').classList.add('hidden');
    }

    // ===== Goals Rendering =====
    function renderGoals() { renderStoreGoals(); renderRateGoals(); }

    function renderStoreGoals() {
      document.getElementById('store-goals-grid').innerHTML =
        Object.entries(goals.stores).map(([id, s]) => {
          const actual = salesActuals[id] || 0;
          const pct    = s.target > 0 ? Math.min(100, Math.round(actual / s.target * 100)) : 0;
          const barClr = pct >= 100 ? 'bg-emerald-500' : pct >= 80 ? 'bg-amber-400' : pct >= 50 ? 'bg-amber-600' : 'bg-red-500';
          const txtClr = pct >= 100 ? 'text-emerald-400' : pct >= 80 ? 'text-yellow-400' : pct >= 50 ? 'text-yellow-400' : 'text-red-400';
          const actualTxt = actual > 0
            ? `¥${Math.round(actual/10000).toLocaleString()}万 <span class="font-black">${pct}%</span>`
            : '<span class="text-gray-700">実績取得中...</span>';
          return `
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
              <div class="text-[10px] text-gray-500 mb-1 font-medium">${s.name}</div>
              <div class="font-black text-xl text-white mb-0.5">
                ¥${Math.round(s.target/10000).toLocaleString()}<span class="text-xs font-normal text-gray-600">万</span>
              </div>
              <div class="text-[11px] ${txtClr} mb-2">${actualTxt}</div>
              <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                <div class="h-full ${barClr} rounded-full progress-bar" style="width:0%"
                  data-target="${pct}"></div>
              </div>
            </div>`;
        }).join('');

      // プログレスバーをアニメーション
      setTimeout(() => {
        document.querySelectorAll('.progress-bar[data-target]').forEach(el => {
          el.style.width = el.dataset.target + '%';
        });
      }, 100);
    }

    function renderRateGoals() {
      const rates = [
        { label:'F率（原価率）', key:'fRate', icon:'fa-fire-flame-curved', color:'text-orange-400', border:'border-orange-900/50' },
        { label:'L率（人件費率）', key:'lRate', icon:'fa-users',            color:'text-blue-400',   border:'border-blue-900/50' },
      ];
      document.getElementById('rate-goals-grid').innerHTML = rates.map(r => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex items-center gap-4">
          <div class="w-10 h-10 bg-gray-800 border ${r.border} rounded-xl flex items-center justify-center flex-shrink-0">
            <i class="fa-solid ${r.icon} ${r.color}"></i>
          </div>
          <div>
            <div class="text-[10px] text-gray-500 font-medium">${r.label}　目標</div>
            <div class="font-black text-2xl text-white">
              ${goals[r.key]}<span class="text-sm font-normal text-gray-500">%</span>
              <span class="text-xs font-normal text-gray-600 ml-1">以下</span>
            </div>
          </div>
        </div>`).join('');
    }

    // ===== Edit Goals =====
    function editGoals() {
      const storeRows = Object.entries(goals.stores).map(([id, s]) => `
        <div class="flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-2.5">
          <span class="text-sm text-gray-400 w-20 flex-shrink-0">${s.name}</span>
          <span class="text-xs text-gray-600 flex-shrink-0">¥</span>
          <input type="number" value="${s.target}" data-store="${id}"
            class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 text-white text-sm focus:outline-none focus:border-amber-400 min-w-0">
          <span class="text-xs text-gray-600 flex-shrink-0">円</span>
        </div>`).join('');

      document.getElementById('goals-form').innerHTML = `
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider pb-1">店舗別月次売上目標</p>
        ${storeRows}
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider pt-3 pb-1">KPI目標</p>
        <div class="flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-2.5">
          <span class="text-sm text-gray-400 w-28 flex-shrink-0">F率（原価率）</span>
          <input type="number" id="edit-fRate" value="${goals.fRate}" min="0" max="100"
            class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 text-white text-sm focus:outline-none focus:border-amber-400">
          <span class="text-xs text-gray-600">%以下</span>
        </div>
        <div class="flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-2.5">
          <span class="text-sm text-gray-400 w-28 flex-shrink-0">L率（人件費率）</span>
          <input type="number" id="edit-lRate" value="${goals.lRate}" min="0" max="100"
            class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 text-white text-sm focus:outline-none focus:border-amber-400">
          <span class="text-xs text-gray-600">%以下</span>
        </div>`;
      document.getElementById('goals-modal').classList.remove('hidden');
    }

    function saveGoals() {
      document.querySelectorAll('[data-store]').forEach(el => {
        const id = el.dataset.store;
        const v  = parseInt(el.value);
        if (v > 0) goals.stores[id].target = v;
      });
      const fv = parseFloat(document.getElementById('edit-fRate').value);
      const lv = parseFloat(document.getElementById('edit-lRate').value);
      if (fv > 0) goals.fRate = fv;
      if (lv > 0) goals.lRate = lv;
      localStorage.setItem('okk_goals', JSON.stringify(goals));
      document.getElementById('goals-modal').classList.add('hidden');
      renderGoals();
    }

    // ===== Sales from GAS =====
    async function fetchSales() {
      try {
        const now  = new Date();
        const res  = await fetch(`${GAS_URL}?year=${now.getFullYear()}&month=${now.getMonth()+1}`);
        const data = await res.json();
        if (!Array.isArray(data)) return;
        salesActuals = {};
        data.forEach(row => {
          if (!row.storeId) return;
          salesActuals[row.storeId] = (salesActuals[row.storeId] || 0) + (row.totalSales || 0);
        });
        renderStoreGoals();
      } catch (e) {
        console.log('売上データ取得エラー（ダッシュボードから確認してください）');
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
